<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Algorithms Playground</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="cover" class="panel">
      <h1>Algorithms Playground</h1>
      <p>Select a language to start</p>
      <div class="lang-buttons">
        <button class="lang-btn" data-lang="java">Java</button>
        <button class="lang-btn" data-lang="js">JavaScript</button>
      </div>
    </div>

    <div id="alg-list" class="panel hidden">
      <button id="back-from-list" class="back">◀ Back</button>
      <h2 id="alg-title">Algorithms</h2>
      <ul id="algorithms"></ul>
    </div>

    <div id="code-view" class="panel hidden">
      <button id="back-from-code" class="back">◀ Back</button>
      <div id="code-area">
        <h3 id="code-name"></h3>
        <pre id="source-code" class="code-block"></pre>
      </div>
      <div id="actions">
        <button id="execute-btn">Execute ▶</button>
      </div>
    </div>
  </div>

  <div id="exec-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <button id="close-modal" class="modal-close">✖</button>
      <div id="modal-output" class="modal-output"></div>
      <form id="modal-form" class="modal-form"></form>
      <div class="modal-controls">
        <button id="run-code" class="run">Run</button>
      </div>
    </div>
  </div>

  <script src="js/algorithms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
